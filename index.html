<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Telefon</title>
    <style>
        :root {
            --bg-dark: #121212; --bg-panel: #1e1e1e;
            --accent: #4CAF50; --text: #ffffff; --text-muted: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        
        body { 
            background-color: #000; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; height: 100dvh; 
            color: var(--text); overflow: hidden; 
        }
        
        #app-container { 
            width: 100%; max-width: 450px; height: 100%; 
            background-color: var(--bg-dark); position: relative; 
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        .screen { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; 
            transition: transform 0.3s ease, opacity 0.3s ease; 
            display: flex; flex-direction: column; background: var(--bg-dark); z-index: 1; 
        }
        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); z-index: 0; }
        .active { opacity: 1; transform: scale(1); z-index: 10; }
        .slide-hidden { opacity: 0; pointer-events: none; transform: translateX(20px); z-index: 0; }
        .slide-active { opacity: 1; transform: translateX(0); z-index: 10; }

        /* --- ANDROID ANA EKRAN --- */
        #screen-home {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop') center/cover;
            justify-content: space-between;
        }
        .status-bar {
            display: flex; justify-content: space-between; padding: 15px 20px;
            font-size: 14px; font-weight: 500; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            padding-top: env(safe-area-inset-top, 15px);
        }
        .dock {
            padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            display: flex; justify-content: center; gap: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
        }
        .app-icon {
            width: 60px; height: 60px; border-radius: 22%; border: none;
            font-size: 30px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .phone-icon { background-color: #4CAF50; color: white; }

        /* Başlıklar ve Menüler */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: #111; border-bottom: 1px solid #333; padding-top: env(safe-area-inset-top, 20px);}
        header h2 { font-weight: 500; font-size: 20px; letter-spacing: 1px; }
        .icon-btn { background: none; border: none; color: var(--accent); font-size: 24px; cursor: pointer; padding: 5px;}
        
        /* Ana Ekran / Rehber */
        #contact-list, #history-list, #message-list { list-style: none; overflow-y: auto; flex-grow: 1; padding: 10px; padding-bottom: 30px; }
        .list-item { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .contact-info { flex-grow: 1; }
        .contact-info h3 { font-size: 18px; font-weight: 400; }
        .contact-info p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
        
        .action-btns { display: flex; align-items: center; gap: 8px;}
        .action-btns button { background: #333; color: white; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        .action-btns button.call-btn { background: var(--accent); }
        .action-btns button.del-btn { background: transparent; color: #ff4444; font-size: 20px; width: 30px;}

        /* Mesaj Ekranı */
        #screen-messages { background: #0a0a0a; }
        .message-bubble { background: #2b5278; padding: 12px 15px; border-radius: 18px 18px 0 18px; margin: 10px 0; max-width: 80%; align-self: flex-end; font-size: 15px; float: right; clear: both; }
        .message-status { font-size: 10px; color: #88B; text-align: right; display: block; margin-top: 5px; }
        .message-input-area { display: flex; padding: 15px; background: #111; padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px)); }
        .message-input-area input { flex-grow: 1; padding: 12px; border-radius: 20px; border: none; background: #222; color: white; outline: none; }
        .message-input-area button { background: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; margin-left: 10px; cursor: pointer; }

        /* Arama Ekranı */
        #screen-call { background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%); text-align: center; justify-content: space-between; padding: 60px 20px 60px; }
        .call-profile { margin-top: 20px; }
        .call-profile h2 { font-size: 36px; font-weight: 300; margin-bottom: 10px; letter-spacing: 2px; }
        #call-status { color: #888; font-size: 18px; }
        #call-timer { font-size: 20px; color: var(--accent); margin-top: 10px; font-variant-numeric: tabular-nums; }
        
        .ambient-controls { margin-top: 40px; display: flex; justify-content: center; gap: 15px; opacity: 0; transition: opacity 1s; flex-wrap: wrap;}
        .ambient-btn { background: transparent; border: 1px solid #444; color: #888; border-radius: 20px; padding: 8px 15px; cursor: pointer; font-size: 12px; margin-bottom: 10px; }
        .ambient-btn.active-ambient { border-color: var(--accent); color: var(--accent); }

        .end-call-btn { background-color: #ff3b30; color: white; border: none; width: 75px; height: 75px; border-radius: 50%; font-size: 28px; display: flex; justify-content: center; align-items: center; margin: 0 auto; cursor: pointer; box-shadow: 0 4px 15px rgba(255,59,48,0.4); margin-bottom: 20px; }
        
        /* Bottom Nav */
        .bottom-nav { display: flex; justify-content: space-around; background: #111; padding: 15px 0; padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #222; margin-top: auto; }
        .nav-item { color: #666; cursor: pointer; font-size: 24px; text-align: center; flex: 1; }
        .nav-item.active-nav { color: var(--accent); }
        .nav-item span { display: block; font-size: 10px; margin-top: 5px; }

    </style>
</head>
<body>

<div id="app-container">
    
    <!-- ANDROID ANA EKRAN -->
    <div id="screen-home" class="screen active">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <span>📶 100% 🔋</span>
        </div>
        <div class="dock">
            <button class="app-icon phone-icon" onclick="openPhoneApp()">📞</button>
        </div>
    </div>

    <!-- REHBER UYGULAMASI -->
    <div id="screen-contacts" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="navTo('screen-home')" style="font-size: 18px;">🏠 Ana Ekran</button>
            <div style="display:flex; gap:15px;">
                <button class="icon-btn" onclick="requestNotifications()">🔔</button>
                <button class="icon-btn" onclick="addNewContact()">➕</button>
            </div>
        </header>
        <div id="contact-list">
            <!-- Kişiler buraya JS ile gelecek -->
        </div>
        <div class="bottom-nav">
            <div class="nav-item active-nav">👤<span>Kişiler</span></div>
            <div class="nav-item" onclick="navTo('screen-history')">🕒<span>Geçmiş</span></div>
        </div>
    </div>

    <!-- GEÇMİŞ EKRANI -->
    <div id="screen-history" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="navTo('screen-home')" style="font-size: 18px;">🏠</button>
            <h2>Son Aramalar</h2>
            <div style="width:30px;"></div>
        </header>
        <ul id="history-list"></ul>
        <div class="bottom-nav">
            <div class="nav-item" onclick="navTo('screen-contacts')">👤<span>Kişiler</span></div>
            <div class="nav-item active-nav">🕒<span>Geçmiş</span></div>
        </div>
    </div>

    <!-- MESAJLAŞMA EKRANI -->
    <div id="screen-messages" class="screen hidden">
        <header>
            <button class="icon-btn" onclick="navTo('screen-contacts')">◀</button>
            <h2 id="msg-header-name">İsim</h2>
            <div style="width:24px;"></div>
        </header>
        <div id="message-list-container" style="flex-grow: 1; overflow-y: auto; padding: 15px;"></div>
        <div class="message-input-area">
            <input type="text" id="msg-input" placeholder="Bir şeyler yaz..." autocomplete="off">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- ARAMA EKRANI -->
    <div id="screen-call" class="screen hidden">
        <div class="call-profile">
            <h2 id="call-header-name">İsim</h2>
            <p id="call-status">Aranıyor...</p>
            <p id="call-timer" class="hidden">00:00</p>
        </div>
        
        <div class="ambient-controls" id="ambient-controls">
            <button class="ambient-btn active-ambient" onclick="setAmbient('wind')">Rüzgar</button>
            <button class="ambient-btn" onclick="setAmbient('sea')">Deniz</button>
            <button class="ambient-btn" onclick="setAmbient('rain')">Yağmur</button>
            <button class="ambient-btn" onclick="setAmbient('fire')">Şömine</button>
        </div>

        <div>
            <button class="end-call-btn" onclick="endCall()">☎</button>
        </div>
    </div>

</div>

<script>
    /* ================= SAAT GÜNCELLEMESİ ================= */
    function updateClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hrs}:${mins}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ================= SES JENERATÖRÜ (Türkiye Standart & Analog Sesler) ================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx, ringOsc, ringInt, noiseNode, filterNode, lfoNode;
    let callPhase = 0; 

    function initAudio() { if(!actx) actx = new AudioContext(); if(actx.state === 'suspended') actx.resume(); }

    function playRingTone() {
        initAudio();
        const osc = actx.createOscillator(); osc.frequency.value = 425; 
        const gain = actx.createGain(); gain.gain.value = 0;
        osc.connect(gain); gain.connect(actx.destination);
        osc.start();

        function triggerRing() {
            if(callPhase !== 1) return;
            gain.gain.setTargetAtTime(0.4, actx.currentTime, 0.05);
            setTimeout(() => {
                if (ringOsc && callPhase === 1) gain.gain.setTargetAtTime(0, actx.currentTime, 0.05);
            }, 1500); 
        }
        triggerRing();
        ringInt = setInterval(triggerRing, 4500); 
        ringOsc = { osc, gain };
    }

    function stopRingTone() {
        if(ringInt) clearInterval(ringInt);
        if(ringOsc) {
            ringOsc.gain.gain.setTargetAtTime(0, actx.currentTime, 0.1);
            setTimeout(() => { try { ringOsc.osc.stop(); } catch(e){} }, 200);
        }
    }

    function playClick() {
        initAudio();
        const now = actx.currentTime;
        const osc = actx.createOscillator(); osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        const gainOsc = actx.createGain(); gainOsc.gain.setValueAtTime(0.8, now); gainOsc.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gainOsc); gainOsc.connect(actx.destination);
        osc.start(now); osc.stop(now + 0.15);

        const bufferSize = actx.sampleRate * 0.1; const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
        const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = actx.createBufferSource(); noise.buffer = buffer;
        const noiseFilter = actx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 800;
        const noiseGain = actx.createGain(); noiseGain.gain.setValueAtTime(0.4, now); noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(actx.destination);
        noise.start(now);
    }

    function startAmbient(type = 'wind') {
        initAudio(); stopAmbient();
        const bufferSize = actx.sampleRate * 3; const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
        const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        noiseNode = actx.createBufferSource(); noiseNode.buffer = buffer; noiseNode.loop = true;
        filterNode = actx.createBiquadFilter(); const gainNode = actx.createGain();

        if(type === 'wind') { filterNode.type = 'lowpass'; filterNode.frequency.value = 400; gainNode.gain.value = 0.5; }
        else if(type === 'sea') {
            filterNode.type = 'lowpass'; filterNode.frequency.value = 300;
            lfoNode = actx.createOscillator(); lfoNode.frequency.value = 0.15;
            const lfoGain = actx.createGain(); lfoGain.gain.value = 400;
            lfoNode.connect(lfoGain); lfoGain.connect(filterNode.frequency);
            lfoNode.start(); gainNode.gain.value = 0.8;
        } 
        else if(type === 'rain') { filterNode.type = 'highpass'; filterNode.frequency.value = 1000; gainNode.gain.value = 0.3; }
        else if(type === 'fire') { filterNode.type = 'lowpass'; filterNode.frequency.value = 800; gainNode.gain.value = 0.6; }

        noiseNode.connect(filterNode); filterNode.connect(gainNode); gainNode.connect(actx.destination);
        noiseNode.start();
    }

    function stopAmbient() {
        if(noiseNode) { try { noiseNode.stop(); noiseNode.disconnect(); } catch(e){} }
        if(lfoNode) { try { lfoNode.stop(); lfoNode.disconnect(); } catch(e){} }
    }

    /* ================= VERİ TABANI & UYGULAMA MANTIĞI ================= */
    let contacts = JSON.parse(localStorage.getItem('always_contacts')) || [];
    let history = JSON.parse(localStorage.getItem('always_history')) || [];
    let messages = JSON.parse(localStorage.getItem('always_messages')) || [];
    
    let activeContactName = "";
    let callTimer, callSecs = 0, callTimeout;

    function navTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active'); s.classList.add('hidden');
        });
        document.getElementById(screenId).classList.remove('hidden');
        document.getElementById(screenId).classList.add('active');
        
        if(screenId === 'screen-history') renderHistory();
    }

    function openPhoneApp() {
        navTo('screen-contacts');
        renderContacts();
    }

    /* KİŞİ İŞLEMLERİ */
    function addNewContact() {
        const name = prompt("Rehbere eklenecek kişinin adını girin:");
        if(name && name.trim() !== "") {
            contacts.push({ id: Date.now(), name: name.trim() });
            localStorage.setItem('always_contacts', JSON.stringify(contacts));
            renderContacts();
        }
    }

    function deleteContact(id) {
        if(confirm("Bu kişiyi rehberden silmek istediğine emin misin?")) {
            contacts = contacts.filter(c => c.id !== id);
            localStorage.setItem('always_contacts', JSON.stringify(contacts));
            renderContacts();
        }
    }

    function renderContacts() {
        const list = document.getElementById('contact-list');
        list.innerHTML = '';
        
        if(contacts.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:#888; margin-top:50px;">Rehber boş.<br>Sağ üstteki ➕ ikonundan kişi ekleyebilirsin.</div>`;
            return;
        }

        contacts.forEach(c => {
            const li = document.createElement('div');
            li.className = 'list-item';
            li.innerHTML = `
                <div class="contact-info">
                    <h3>${c.name}</h3>
                </div>
                <div class="action-btns">
                    <button onclick="openMessages('${c.name}')">✉</button>
                    <button class="call-btn" onclick="startCall('${c.name}')">📞</button>
                    <button class="del-btn" onclick="deleteContact(${c.id})">🗑️</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    /* ARAMA İŞLEMLERİ */
    function startCall(name) {
        activeContactName = name;
        document.getElementById('call-header-name').textContent = name;
        navTo('screen-call');
        
        document.getElementById('call-status').textContent = "Aranıyor...";
        document.getElementById('call-timer').classList.add('hidden');
        document.getElementById('ambient-controls').style.opacity = '0';
        
        callPhase = 1; callSecs = 0;
        playRingTone();

        const ringDuration = Math.floor(Math.random() * 4000) + 10000; 

        callTimeout = setTimeout(() => {
            if(callPhase !== 1) return;
            stopRingTone();
            playClick(); // Analog açılma sesi
            
            setTimeout(() => {
                callPhase = 2;
                document.getElementById('call-status').textContent = "Bağlandı";
                document.getElementById('call-timer').classList.remove('hidden');
                document.getElementById('ambient-controls').style.opacity = '1';
                startAmbient('wind');
                
                callTimer = setInterval(() => {
                    callSecs++;
                    const m = String(Math.floor(callSecs/60)).padStart(2,'0');
                    const s = String(callSecs%60).padStart(2,'0');
                    document.getElementById('call-timer').textContent = `${m}:${s}`;
                }, 1000);
            }, 600);
        }, ringDuration);
    }

    function endCall() {
        if(callPhase === 0) return;
        clearTimeout(callTimeout); clearInterval(callTimer);
        stopRingTone(); stopAmbient();
        
        const dateStr = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
        history.unshift({ name: activeContactName, date: dateStr, duration: callPhase === 2 ? callSecs : 0 });
        localStorage.setItem('always_history', JSON.stringify(history));

        callPhase = 0;
        navTo('screen-contacts');
    }

    function setAmbient(type) {
        document.querySelectorAll('.ambient-btn').forEach(b => b.classList.remove('active-ambient'));
        event.target.classList.add('active-ambient');
        startAmbient(type);
    }

    /* MESAJLAŞMA İŞLEMLERİ */
    function openMessages(name) {
        activeContactName = name;
        document.getElementById('msg-header-name').textContent = name;
        navTo('screen-messages');
        renderMessages();
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if(!input.value.trim() || !activeContactName) return;
        
        messages.push({
            name: activeContactName,
            text: input.value.trim(),
            time: new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'})
        });
        localStorage.setItem('always_messages', JSON.stringify(messages));
        input.value = '';
        renderMessages();
    }

    function renderMessages() {
        const container = document.getElementById('message-list-container');
        container.innerHTML = '';
        
        const contactMessages = messages.filter(m => m.name === activeContactName);
        
        contactMessages.forEach(msg => {
            const div = document.createElement('div');
            div.innerHTML = `<div class="message-bubble">${msg.text} <span class="message-status">${msg.time} ✓✓</span></div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        history.forEach(h => {
            const li = document.createElement('li'); li.className = 'list-item';
            const durText = h.duration > 0 ? `${Math.floor(h.duration/60)}m ${h.duration%60}s` : 'Cevapsız';
            const color = h.duration > 0 ? '#4CAF50' : '#ff4444';
            li.innerHTML = `<div class="contact-info"><h3>${h.name}</h3><p>${h.date}</p></div><div style="color:${color}; font-size:14px;">${durText}</div>`;
            list.appendChild(li);
        });
    }

    /* BİLDİRİMLER (Cevapsız Çağrı) */
    function requestNotifications() {
        if ("Notification" in window) {
            Notification.requestPermission().then(perm => {
                if(perm === "granted") {
                    alert("Bildirim izni alındı. Rehberindeki kişilerden rastgele zamanlarda cevapsız çağrı alacaksın.");
                    scheduleRandomCall();
                }
            });
        }
    }

    function scheduleRandomCall() {
        if(contacts.length === 0) return; // Rehber boşsa bildirim atma
        
        const randomTime = Math.floor(Math.random() * (12 - 6 + 1) + 6) * 3600000; 
        setTimeout(() => {
            if(Notification.permission === 'granted' && contacts.length > 0) {
                const randomContact = contacts[Math.floor(Math.random() * contacts.length)].name;
                
                new Notification("Telefon", { body: `${randomContact} kişisinden cevapsız çağrı`, icon: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iIzRDQUY1MCIgZD0iTTEyIDIxLjM1bC0xLjQ1LTEuMzJDNS40IDE1LjM2IDIgMTIuMjggMiA4LjUgMiA1LjQyIDQuNDIgMyA3LjUgM2MyLjA0IDAgNCAxLjUgNS4xMyAzLjU5QTYuMzYgNi4zNiAwIDAgMSAxNi41IDNjMy4wOCAw NS41IDIuNDIgNS41IDUuNSAwIDMuNzgtMy40IDYuODYtOC41NSAxMS41NEwxMiAyMS4zNXoiLz48L3N2Zz4=" });
                
                const dateStr = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                history.unshift({ name: randomContact, date: dateStr, duration: 0 });
                localStorage.setItem('always_history', JSON.stringify(history));
                
                scheduleRandomCall(); 
            }
        }, randomTime);
    }
    
    if("Notification" in window && Notification.permission === "granted") {
        scheduleRandomCall();
    }

    document.getElementById('msg-input').addEventListener('keypress', function(e){
        if(e.key === 'Enter') sendMessage();
    });

</script>
</body>
</html>
